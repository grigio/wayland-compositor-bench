<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>wayland-compositor-bench</title>
  <defs>
    <linearGradient id="peel" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFF38C"/>
      <stop offset="0.4" stop-color="#FFD62B"/>
      <stop offset="0.75" stop-color="#FFC107"/>
      <stop offset="1" stop-color="#EE9B00"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8DDC63"/>
      <stop offset="1" stop-color="#33873B"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="rotate(-20 64 64)">
    <!-- body: lemon silhouette, pointed at both tips -->
    <path d="M10 64
             C10 60.5 13.5 58 18.5 57
             C27 43 45 34 64 34
             C83 34 101 43 109.5 57
             C114.5 58 118 60.5 118 64
             C118 67.5 114.5 70 109.5 71
             C101 85 83 94 64 94
             C45 94 27 85 18.5 71
             C13.5 70 10 67.5 10 64 Z"
          fill="url(#peel)" stroke="#D98600" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- peel dimples -->
    <g fill="#E89400" opacity="0.35">
      <circle cx="40" cy="82" r="1.6"/>
      <circle cx="52" cy="86.5" r="1.4"/>
      <circle cx="70" cy="87" r="1.6"/>
      <circle cx="86" cy="82.5" r="1.3"/>
      <circle cx="34" cy="72" r="1.3"/>
      <circle cx="94" cy="72.5" r="1.4"/>
    </g>

    <!-- gloss -->
    <ellipse cx="50" cy="48" rx="26" ry="12" transform="rotate(-8 50 48)"
             fill="url(#gloss)"/>

    <!-- leaf -->
    <path d="M40 38 C44 24 58 16 72 18 C70 32 56 41 40 38 Z"
          fill="url(#leaf)" stroke="#2A6E32" stroke-width="2" stroke-linejoin="round"/>
    <path d="M44 37 C52 31 61 25 69 20" fill="none" stroke="#B8E986"
          stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
