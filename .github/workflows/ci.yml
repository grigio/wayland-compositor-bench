name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version sync (Cargo.toml is the source of truth)
        run: |
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          PKG=$(sed -n 's/^pkgver=//p' PKGBUILD | head -n1)
          LOCK=$(awk '/^name = "wayland-compositor-bench"$/{getline; print}' Cargo.lock \
            | sed -n 's/^version = "\(.*\)"/\1/p')
          [ -n "$CARGO" ] || { echo "Cargo.toml version not found"; exit 1; }
          [ "$CARGO" = "$PKG" ] || { echo "PKGBUILD $PKG != Cargo.toml $CARGO"; exit 1; }
          [ "$CARGO" = "$LOCK" ] || { echo "Cargo.lock $LOCK != Cargo.toml $CARGO"; exit 1; }
          echo "versions in sync: $CARGO"

      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "${{ github.ref_name }}" = "v$CARGO" ] \
            || { echo "tag ${{ github.ref_name }} != v$CARGO"; exit 1; }

  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # The Arch image has no git: install it before checkout.
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git rust pkgconf gtk4

      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: wayland-compositor-bench-linux-x86_64
          path: target/release/wayland-compositor-bench

  msrv:
    # Keep the declared floor honest: gtk4-rs moves its own MSRV, so a
    # dependency bump can silently raise ours.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev pkg-config

      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: |
          VERSION=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ -n "$VERSION" ] || { echo "rust-version not found"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Check on the declared MSRV
        run: cargo check --all-targets --locked

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  package:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git rust pkgconf gtk4

      - uses: actions/checkout@v5

      # makepkg refuses to run as root. Build as an unprivileged user; the
      # PKGBUILD builds from $startdir, so the Rust sources are not touched.
      - name: Build Arch Linux package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg --noconfirm --force"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: archlinux-package
          path: '*.pkg.tar.zst'

  deb:
    # Debian 13 (trixie) ships GTK 4.18, so this job both builds the .deb and
    # proves the source still compiles against the oldest supported GUI stack.
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config \
            libgtk-4-dev lintian

      - uses: actions/checkout@v5

      # Debian's rustc is older than Cargo.toml's rust-version, so use rustup.
      - name: Install Rust toolchain
        run: |
          RUST=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$RUST"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Build Debian package
        run: ./packaging/build-deb.sh

      - name: Lint Debian package
        run: lintian --fail-on error dist/*.deb

      - name: Upload package
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, package, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history + tags: the release body lists the commits since the
      # previous v* tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build release notes (titles since the previous tag)
        run: |
          TAG="${{ github.ref_name }}"
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "$TAG" | head -n1 || true)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$TAG"
            HEADER="Changes since $PREV:"
          else
            RANGE="$TAG"
            HEADER="Changes in $TAG:"
          fi
          {
            echo "$HEADER"
            COMMITS=$(git log --format='- %s' "$RANGE" || true)
            [ -n "$COMMITS" ] || COMMITS=$(git show -s --format='- %s' "$TAG")
            echo "$COMMITS"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # One directory with everything that ships, plus checksums: the binary,
      # both distro packages and the source tarball.
      - name: Collect assets
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="wayland-compositor-bench-$VERSION/" \
            -o "dist/wayland-compositor-bench-$VERSION.tar.gz" HEAD
          cp artifacts/wayland-compositor-bench-linux-x86_64/wayland-compositor-bench dist/
          cp artifacts/archlinux-package/wayland-compositor-bench-[0-9]*.pkg.tar.zst dist/
          cp artifacts/debian-package/*.deb dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
